<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22304a"/>
      <stop offset="1" stop-color="#0a0e15"/>
    </linearGradient>
    <radialGradient id="glow" cx="128" cy="124" r="100" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2fdcc3" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#2fdcc3" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ring" gradientUnits="userSpaceOnUse" x1="20" y1="0" x2="236" y2="0">
      <stop offset="0" stop-color="#d4f86a"/>
      <stop offset="0.55" stop-color="#5fe6a4"/>
      <stop offset="1" stop-color="#22d6c2"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d2f4ed"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>
  <rect width="256" height="256" rx="56" fill="url(#bg)"/>
  <circle cx="128" cy="124" r="100" fill="url(#glow)"/>
  <!-- back half of the orbit, behind the screen -->
  <g transform="rotate(-17 128 128)" fill="none" stroke="url(#ring)" stroke-width="15" stroke-linecap="round">
    <path d="M20 128 A108 38 0 0 1 236 128" opacity="0.45"/>
  </g>
  <rect x="70" y="84" width="116" height="80" rx="13" fill="url(#screen)"/>
  <rect x="70" y="84" width="116" height="80" rx="13" fill="none" stroke="#ffffff" stroke-opacity="0.6" stroke-width="2"/>
  <!-- front half, with a soft shadow on the screen -->
  <g transform="rotate(-17 128 128)" fill="none" stroke-linecap="round">
    <path d="M20 128 A108 38 0 0 0 236 128" stroke="#05080d" stroke-width="15" opacity="0.55" filter="url(#soft)" transform="translate(0 -4)"/>
    <path d="M20 128 A108 38 0 0 0 236 128" stroke="url(#ring)" stroke-width="15"/>
  </g>
</svg>
